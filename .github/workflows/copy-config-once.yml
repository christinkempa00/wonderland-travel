name: (One-off) Copy config files admin -> klien

on:
  push:
    paths:
      - ".github/workflows/copy-config-once.yml"
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy database.env.php and installed.php from admin/config to klien/config
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          set -e
          echo "Downloading admin/config/database.env.php ..."
          curl --ftp-ssl -k -s --user "${FTP_USER}:${FTP_PASS}" -o db.env.php "ftp://${FTP_SERVER}/admin/config/database.env.php"
          echo "Uploading to klien/config/database.env.php ..."
          curl --ftp-ssl -k -s --user "${FTP_USER}:${FTP_PASS}" -T db.env.php "ftp://${FTP_SERVER}/klien/config/database.env.php"

          echo "Downloading admin/config/installed.php ..."
          curl --ftp-ssl -k -s --user "${FTP_USER}:${FTP_PASS}" -o installed.php "ftp://${FTP_SERVER}/admin/config/installed.php"
          echo "Uploading to klien/config/installed.php ..."
          curl --ftp-ssl -k -s --user "${FTP_USER}:${FTP_PASS}" -T installed.php "ftp://${FTP_SERVER}/klien/config/installed.php"

          rm -f db.env.php installed.php
          echo "Done. Both files copied (contents not printed to log)."
