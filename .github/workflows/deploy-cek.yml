name: Deploy Portal Cek Tagihan ke Hostinger

on:
  push:
    branches: [main]
    paths:
      - "cek/**"
      - ".github/workflows/deploy-cek.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cek/package-lock.json

      - name: Install dependencies
        working-directory: cek
        run: npm ci

      - name: Build
        working-directory: cek
        run: npm run build
        env:
          # Diisi di GitHub → Settings → Secrets and variables → Actions.
          # URL backend admin yang sudah live, mis. https://admin.wonderlandtravel.com
          VITE_API_BASE_URL: ${{ secrets.CEK_API_BASE_URL }}

      - name: Deploy ke subdomain cek via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_CEK_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_CEK_FTP_PASSWORD }}
          local-dir: ./cek/dist/
          server-dir: ./
          dangerous-clean-slate: false
