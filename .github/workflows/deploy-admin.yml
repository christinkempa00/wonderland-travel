name: Deploy Sistem Admin ke Hostinger

on:
  push:
    branches: [main]
    paths:
      - "wonderland-system/**"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy ke public_html/admin via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./wonderland-system/
          server-dir: admin/
          # Beda dari deploy-website.yml: sengaja "false", BUKAN clean-slate.
          # Server produksi sudah punya config/database.env.php dan uploads/
          # (data pengguna, ~1.4GB) yang ditaruh manual, tidak ikut ter-commit
          # di repo ini (lihat wonderland-system/.gitignore). Clean-slate akan
          # menghapus keduanya di server tiap deploy — jangan pernah diaktifkan
          # untuk workflow ini.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.claude/**
            **/uploads/**
            **/cache/**
            **/logs/**
            **/config/database.env.php
            **/config/installed.php
