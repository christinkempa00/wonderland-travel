name: Deploy Portal Klien ke Hostinger

on:
  push:
    branches: [main]
    paths:
      - "wonderland-system/**"
      - ".github/workflows/deploy-klien.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy ke klien.wonderlandtrips.com via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./wonderland-system/
          server-dir: klien/
          # Sama seperti deploy-admin.yml: sengaja "false", BUKAN
          # clean-slate. Server produksi butuh config/database.env.php dan
          # config/installed.php yang ditaruh manual (lihat catatan di
          # deploy-admin.yml) — clean-slate akan menghapusnya tiap deploy.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.claude/**
            **/uploads/**
            **/cache/**
            **/logs/**
            **/config/database.env.php
            **/config/installed.php
