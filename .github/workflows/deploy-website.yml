name: Deploy Website Publik ke Hostinger

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build

      - name: Deploy ke public_html via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: public_html/
          # Next.js kasih nama folder acak baru ("_next/<hash>/") tiap build,
          # jadi folder acak dari build sebelumnya selalu perlu dihapus. Kalau
          # diff-based (false), action ini kadang gagal 550 "No such file or
          # directory" pas coba hapus folder itu jika state di server & yang
          # action catat sempat tidak sinkron (mis. run sebelumnya gagal
          # separuh jalan). "true" = hapus semua & upload ulang bersih tiap
          # kali, lebih lambat tapi tidak pernah nyangkut di kasus ini.
          dangerous-clean-slate: true
